<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14231b">
<title>Перемещения</title>
<link rel="manifest" href="manifest.json">
<script src="config.js?v=10"></script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0f1311; --card:#181e1b; --card2:#1f2622; --ink:#e7ece8; --muted:#97a39c; --line:#2a332e;
  --head:#14231b; --green:#3d9a64; --green-ink:#7fd3a0; --green-soft:#183324;
  --amber:#f0b44c; --amber-soft:#3a2c12; --blue:#4d8ce8; --blue-ink:#9cc0f5; --blue-soft:#172a45;
  --red:#ef7b6f; --red-soft:#3a1d1a; --grey-soft:#232a26;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
button{font:inherit;cursor:pointer;border:0;color:inherit}
input,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 140px}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:14px 16px 12px;padding-top:max(14px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
header .row{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;font-weight:650}
header small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.hbtn{background:var(--grey-soft);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:14px}
.hbtn + .hbtn{margin-left:6px}
.more{display:block;width:100%;text-align:center;padding:12px;border-radius:12px;background:var(--grey-soft);color:var(--green-ink);font-weight:600;font-size:15px;margin-top:2px}
.filters{display:flex;gap:6px;margin:6px 0 4px}
.filters button{padding:8px 14px;border-radius:20px;background:var(--grey-soft);color:var(--muted);font-weight:600;font-size:14px}
.filters button.on{background:var(--green-soft);color:var(--green-ink)}
.histhead{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
.histhead h2{font-size:21px;margin:0}
.demo{background:var(--amber-soft);color:var(--amber);font-size:13px;text-align:center;padding:6px 16px}
.pushbar{display:flex;align-items:center;gap:10px;background:var(--blue-soft);color:var(--blue-ink);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
.pushbar span{flex:1}
.pushbar button{background:var(--blue);color:#fff;border-radius:10px;padding:8px 12px;font-weight:650}
.tabs{display:flex;gap:6px;margin:14px 0 6px;background:var(--grey-soft);padding:4px;border-radius:12px}
.tabs button{flex:1;padding:9px;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;position:relative}
.tabs button.on{background:var(--card2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:#d6493d;color:#fff;font-size:12px;line-height:20px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 2px 8px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.card.need{border:2px solid var(--amber)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.route{font-weight:650;font-size:17px}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.pill{font-size:12px;font-weight:650;padding:4px 9px;border-radius:20px;white-space:nowrap}
.s-new{background:var(--amber-soft);color:var(--amber)}
.s-acc{background:var(--blue-soft);color:var(--blue-ink)}
.s-ok{background:var(--green-soft);color:var(--green-ink)}
.s-rej{background:var(--red-soft);color:var(--red)}
.s-can{background:var(--grey-soft);color:var(--muted)}
.items{margin:10px 0 0;padding:0;list-style:none;border-top:1px dashed var(--line)}
.items li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.items li:last-child{border-bottom:0}
.diff{color:var(--red);font-weight:600;font-size:13px;margin-left:6px}
.note{background:var(--grey-soft);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px;color:#c9d1cc}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:650;font-size:16px}
.btn.pri{background:var(--green);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:var(--grey-soft);color:var(--ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn:disabled{opacity:.5}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px max(12px,env(safe-area-inset-bottom))}
.fab{display:block;width:100%;max-width:528px;margin:0 auto;padding:16px;border-radius:16px;background:var(--green);color:#fff;font-weight:700;font-size:17px}
.fab:disabled{background:var(--grey-soft);color:var(--muted);cursor:default}
.field{position:relative}
.field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.field .search{padding-left:42px;margin-bottom:0}
.sug{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden}
.sug button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:13px 14px;background:none;border-bottom:1px solid var(--line);font-size:15px}
.sug button:last-child{border-bottom:0}
.sug button:active,.sug button:hover{background:var(--card2)}
.sug .u{color:var(--muted);font-size:13px;flex-shrink:0}
.sug mark{background:none;color:var(--green-ink);font-weight:700}
.sug .none{padding:13px 14px;color:var(--muted);font-size:14px}
.picked{display:flex;align-items:center;gap:12px;background:var(--green-soft);border:1.5px solid var(--green);border-radius:12px;padding:12px 12px 12px 14px}
.picked .t{flex:1;min-width:0}
.picked .t b{display:block;font-size:16px}
.picked .t small{color:var(--muted);font-size:13px}
.x{width:36px;height:36px;border-radius:10px;background:var(--grey-soft);color:var(--muted);font-size:18px;flex-shrink:0}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 14px;margin-top:8px}
.item .n{flex:1;min-width:0;font-weight:600;font-size:15px}
.item .n small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.empty-items{color:var(--muted);font-size:14px;padding:14px 2px 0}
.login{padding-top:30px}
.login img{display:block;width:150px;margin:0 auto 22px}
.login h2{font-size:22px;margin:0 0 6px;text-align:center}
.login p{color:var(--muted);margin:0 0 18px;text-align:center;font-size:15px}
.login .err{color:var(--red);text-align:center;font-size:14px;min-height:20px;margin-bottom:8px}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s}
#splash img{width:min(180px,50vw);height:auto}
#splash b{font-size:22px;letter-spacing:.01em}
#splash small{color:var(--muted);font-size:15px;letter-spacing:.04em}
#splash.hide{opacity:0;pointer-events:none}
#ptr{position:fixed;left:50%;top:0;z-index:4;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(-50px);pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#ptr svg{width:20px;height:20px;color:var(--green-ink)}
#ptr.spin svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
html,body{overscroll-behavior-y:contain}
#sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green-ink);margin-left:8px;vertical-align:middle;opacity:0;transition:opacity .2s}
body.syncing #sync{opacity:1;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.s-pend{background:var(--grey-soft);color:var(--muted)}
.saving{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;margin-right:7px;vertical-align:-1px;animation:ptrspin .8s linear infinite}
.card.pending{opacity:.75}
#installCard{max-width:560px;margin:12px auto 0;padding:0 16px}
#installCard[hidden]{display:none}
.install{display:flex;align-items:center;gap:12px;background:var(--green-soft);border:1.5px solid var(--green);border-radius:14px;padding:12px 12px 12px 14px}
.install img{width:44px;height:44px;border-radius:10px;flex-shrink:0}
.install .txt{flex:1;min-width:0}
.install .txt b{display:block;font-size:15px}
.install .txt span{color:var(--muted);font-size:13px}
.install button{background:var(--green);color:#fff;border-radius:10px;padding:10px 14px;font-weight:650;font-size:14px;flex-shrink:0}
.install-steps{margin:0;padding:10px 14px 2px 34px;font-size:14px;color:var(--ink)}
.install-steps li{margin:4px 0}
.install-steps[hidden]{display:none}
.pick h2{font-size:22px;margin:26px 0 6px}
.pick p{color:var(--muted);margin:0 0 16px}
.choice{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;font-size:17px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 16px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:600}
.chip.on{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:8px}
.prod{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:6px}
.prod.sel{border-color:var(--green);background:#16241c}
.prod .n{flex:1;font-weight:550}
.prod .u{color:var(--muted);font-size:13px;font-weight:400}
.step{display:flex;align-items:center;gap:4px}
.step button{width:42px;height:42px;border-radius:10px;background:var(--grey-soft);font-size:22px;line-height:1}
.step input{width:58px;height:42px;text-align:center;border:1px solid var(--line);border-radius:10px;font-weight:650;background:var(--card2)}
textarea{width:100%;min-height:70px;padding:12px;border-radius:12px;border:1px solid var(--line);resize:vertical;background:var(--card)}
.back{background:none;color:var(--green-ink);font-weight:600;padding:16px 0 0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--bg);border-top:1px solid var(--line);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:19px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:#e7ece8;color:#0f1311;padding:10px 16px;border-radius:12px;z-index:30;font-size:15px;max-width:90%;text-align:center;font-weight:550}
.loading{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div id="splash"><img src="logo.png" alt="Яблонька"><small>Перемещения товара</small></div>
<header><div class="row"><h1 id="title">Перемещения</h1><span id="hright"></span></div></header>
<div id="demo" class="demo" hidden>Демо-режим: данные хранятся только на этом устройстве. «Сменить точку» — чтобы сыграть за другую сторону.</div>
<div id="installCard" hidden>
  <div class="install"><img src="icon-192.png" alt=""><div class="txt"><b>Установите приложение</b><span>Иконка «Яблонька» появится на главном экране</span></div><button id="installBtn">Установить</button></div>
  <ol id="installSteps" class="install-steps" hidden></ol>
</div>
<div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"></path><path d="M20 4v5h-5"></path></svg></div>
<main class="wrap" id="app"></main>
<div id="layer"></div>

<script>
/* ===== Настройки — в config.js ===== */
const CONF = window.APP_CONFIG || {};
const API_URL = CONF.API_URL || '';
const PUSH_CONFIGURED = !!(CONF.FIREBASE && CONF.FIREBASE.apiKey && CONF.VAPID_KEY);
const FB_VER = '10.12.2';
const POLL_MS = 30000; // новые заявки приходят пушем, опрос — только подстраховка

/* ===== Хранилище на устройстве (точка) ===== */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ===== API ===== */
async function api(action, data = {}){
  if(S && S.me && S.me.point && data.point===undefined) data = {...data, point:S.me.point};
  if(!API_URL) return mock(action, data);
  syncN++; document.body.classList.add('syncing');
  try{ return await apiFetch(action, data); }
  finally{ if(--syncN<=0){ syncN=0; document.body.classList.remove('syncing'); } }
}
let syncN = 0;
async function apiFetch(action, data){
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, ...data})});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'Ошибка');
  return j.data;
}

/* ===== Демо-сервер (та же логика, что в Code.gs) ===== */
const DEMO_CFG = {
  points:[{city:'Пенза',point:'Точка 1',filial:'Пенза'},{city:'Пенза',point:'Точка 2',filial:'Пенза'},{city:'Засечное',point:'Засечное — Точка 3',filial:'Пенза'},
          {city:'Балаково',point:'Точка 4',filial:'Балаково'},{city:'Балаково',point:'Точка 5',filial:'Балаково'},{city:'Вольск',point:'Вольск — Точка 6',filial:'Балаково'}],
  products:[{name:'Круассан шоколадный',unit:'шт',group:'Слоёная выпечка сладкая'},{name:'Круассан с вишней и марципаном',unit:'шт',group:'Слоёная выпечка сладкая'},
            {name:'Улитка с изюмом',unit:'шт',group:'Слоёная выпечка сладкая'},{name:'Пирожок с вишней',unit:'шт',group:'Пирожки сладкие'},
            {name:'Пирожок с мясом',unit:'шт',group:'Пирожки сытные'},{name:'Пирог с капустой и яйцом',unit:'кг',group:'Пироги сытные'},
            {name:'Десерт Киевский',unit:'шт',group:'Десерты'},{name:'Хлеб Бородинский',unit:'шт',group:'Хлеб'},{name:'Каравай русский',unit:'кг',group:'Караваи'}]
};
let demoDB = store.get('demo_db') || [];
function mock(action, p){
  return new Promise((res, rej) => setTimeout(() => {
    try{
      const cityOf = pt => (DEMO_CFG.points.find(x=>x.point===pt)||{}).city;
      const find = id => { const t = demoDB.find(x=>x.id===id); if(!t) throw new Error('Заявка не найдена'); return t; };
      const guard = (t, side, from) => {
        const owner = side==='to'?t.to:t.from;
        if(owner!==p.point) throw new Error('Это действие доступно только точке «'+owner+'»');
        if(t.status!==from) throw new Error('Заявка уже в статусе «'+t.status+'»');
      };
      let out;
      switch(action){
        case 'config': out = DEMO_CFG; break;
        case 'boot': { const pt=DEMO_CFG.points.find(x=>x.point===p.point); if(!pt) throw new Error('Точка не найдена — выберите её заново');
          out={ me:pt, cfgVer:'demo', list: demoDB.filter(t=>t.from===pt.point||t.to===pt.point).sort((a,b)=>b.created.localeCompare(a.created)) };
          if(p.cfgVer!=='demo') out.config=DEMO_CFG; break; }
        case 'history': out = demoDB.filter(t=>(t.from===p.point||t.to===p.point) && !['Новая','Принята'].includes(t.status)).sort((a,b)=>b.created.localeCompare(a.created)); break;
        case 'list': out = demoDB.filter(t=>t.from===p.point||t.to===p.point).sort((a,b)=>b.created.localeCompare(a.created)); break;
        case 'create': {
          if(p.from===p.to) throw new Error('Нельзя переместить на свою же точку');
          const fil = pt=>(DEMO_CFG.points.find(x=>x.point===pt)||{}).filial;
          if(fil(p.from)!==fil(p.to)) throw new Error('Перемещение возможно только между точками своего филиала');
          const units = Object.fromEntries(DEMO_CFG.products.map(x=>[x.name,x.unit]));
          const id = 'П-'+Date.now().toString().slice(-6);
          demoDB.push({id, created:new Date().toISOString(), city:cityOf(p.from), from:p.from, to:p.to, status:'Новая',
            accepted:'', received:'', comment:p.comment||'', reason:'',
            items:p.items.map(i=>({product:i.product, qty:+i.qty, unit:units[i.product]||'шт', got:null}))});
          out = {id}; break;
        }
        case 'accept': { const t=find(p.id); guard(t,'to','Новая'); t.status='Принята'; t.accepted=new Date().toISOString(); out={}; break; }
        case 'reject': { const t=find(p.id); guard(t,'to','Новая'); t.status='Отклонена'; t.reason=p.reason||''; out={}; break; }
        case 'cancel': { const t=find(p.id); guard(t,'from','Новая'); t.status='Отменена'; out={}; break; }
        case 'receive': { const t=find(p.id); guard(t,'to','Принята'); t.status='Получена'; t.received=new Date().toISOString();
          const got = Object.fromEntries((p.items||[]).map(i=>[i.product,+i.qty]));
          t.items.forEach(i=>i.got = got[i.product] ?? i.qty); out={}; break; }
        default: throw new Error('Неизвестное действие');
      }
      store.set('demo_db', demoDB);
      res(JSON.parse(JSON.stringify(out)));
    }catch(e){ rej(e); }
  }, 250));
}

/* ===== Состояние ===== */
const S = {
  cfg:null, me: store.get('point'), view:'list', tab:'in', list:[], pickCity:null,
  draft:{to:null, qty:{}, comment:'', q:'', group:''}, seen: new Set(store.get('seen')||[])
};
const $app = document.getElementById('app'), $layer = document.getElementById('layer');
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT = iso => { if(!iso) return ''; const d=new Date(iso), n=new Date();
  const t = d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  return d.toDateString()===n.toDateString() ? 'сегодня, '+t : d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+t; };
const num = v => { const x = parseFloat(String(v).replace(',','.')); return isFinite(x)&&x>0 ? Math.round(x*1000)/1000 : 0; };
const myFilial = () => S.me && (S.me.filial || S.me.city);
const FILIALS = CONF.FILIALS || ['Пенза','Балаково'];         // филиалы, где перемещения доступны
const filialOf = p => p.filial || p.city;
const norm = x => String(x||'').toLowerCase().replace(/ё/g,'е');
function matchList(list, q, key, limit){
  const words = norm(q).trim().split(/\s+/).filter(Boolean); if(!words.length) return [];
  const res = list.filter(x=>{ const n=norm(key(x)); return words.every(w=>n.includes(w)); });
  res.sort((a,b)=>{ const A=norm(key(a)).startsWith(words[0])?0:1, B=norm(key(b)).startsWith(words[0])?0:1; return A-B || key(a).localeCompare(key(b),'ru'); });
  return res.slice(0, limit);
}
function hl(text, q){ // подсветка совпадений
  let out = esc(text); norm(q).trim().split(/\s+/).filter(w=>w.length>0).forEach(w=>{
    const i = norm(text).indexOf(w); if(i<0) return;
    const part = esc(text.slice(i, i+w.length)); out = out.replace(part, '<mark>'+part+'</mark>'); });
  return out;
}
const SEARCH_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>';
// «Пенза — Антонова, 18В» → «Антонова, 18В», но только для своего города: «Вольск — Основная точка» остаётся полным
const short = p => { const m=String(p||'').match(/^([^—]+?)\s*—\s*(.+)$/); return m && S.me && m[1]===S.me.city ? m[2] : String(p||''); };  // «Пенза — Антонова, 18В» → «Антонова, 18В»

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }

/* ===== Пуш-уведомления (Firebase Cloud Messaging) ===== */
let swReg = null, messaging = null;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function loadScript(src){ return new Promise((ok, fail)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>fail(new Error('Не загрузился '+src)); document.head.appendChild(s); }); }
async function getMessaging(){
  if(messaging) return messaging;
  if(!window.firebase){
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-messaging-compat.js`);
  }
  if(!firebase.apps.length) firebase.initializeApp(CONF.FIREBASE);
  messaging = firebase.messaging();
  messaging.onMessage(m=>{ const d=m.data||{}; toast(d.title||'Обновление заявок'); if(navigator.vibrate) navigator.vibrate([120,60,120]); refresh(true); });
  return messaging;
}
/* 'off' — пуши не настроены; 'ios-install' — нужно добавить на экран Домой; 'ask'; 'on'; 'denied' */
function pushStatus(){
  if(!PUSH_CONFIGURED || !swReg) return 'off';
  if(!('Notification' in window) || !('PushManager' in window)) return isIOS && !isStandalone ? 'ios-install' : 'off';
  if(Notification.permission==='denied') return 'denied';
  if(Notification.permission==='granted'){ const sub=store.get('push_sub'); return sub && sub.point===S.me.point ? 'on' : 'ask'; }
  return 'ask';
}
async function enablePush(silent){
  try{
    const perm = Notification.permission==='granted' ? 'granted' : await Notification.requestPermission();
    if(perm!=='granted'){ if(!silent) toast('Уведомления запрещены в настройках телефона'); render(); return; }
    const m = await getMessaging();
    const token = await m.getToken({vapidKey: CONF.VAPID_KEY, serviceWorkerRegistration: swReg});
    if(!token) throw new Error('Не удалось получить токен');
    await api('subscribe', {point:S.me.point, token});
    store.set('push_sub', {point:S.me.point, token});
    if(!silent) toast('Уведомления включены');
  }catch(e){ if(!silent) toast('Уведомления: '+e.message); }
  render();
}

/* ===== Загрузка ===== */
const SPLASH_T0 = Date.now();
try{ const o=new URLSearchParams(location.search).get('open'); if(o) S.openId=o; }catch(e){}
function hideSplash(){ const sp=document.getElementById('splash'); if(!sp) return;
  setTimeout(()=>{ sp.classList.add('hide'); setTimeout(()=>sp.remove(),400); }, Math.max(0, (S.me&&S.cfg?350:900)-(Date.now()-SPLASH_T0))); }
async function boot(){
  document.getElementById('demo').hidden = !!API_URL;
  if('serviceWorker' in navigator && location.protocol==='https:'){
    try{ swReg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready; }catch(e){}
    navigator.serviceWorker.addEventListener('message', ev=>{ if(ev.data&&ev.data.type==='refresh' && S.me){ if(ev.data.id) S.openId=ev.data.id; refresh(true); } });
  }
  if(S.me && (!S.me.filial || !FILIALS.includes(S.me.filial))) S.me = null; // старый вход по коду — выбрать точку заново
  const cached = store.get('cfg');
  if(cached && cached.points && cached.points[0] && cached.points[0].filial) S.cfg = cached;
  if(!S.me){
    S.view='pick'; render(); hideSplash();
    if(!S.cfg){ try{ const c = await api('config'); S.cfg = c; store.set('cfg', c); render(); }
      catch(e){ $app.innerHTML = `<div class="empty">Нет связи с сервером.<br>${esc(e.message)}<br><br><button class="btn ghost" onclick="location.reload()">Повторить</button></div>`; } }
  }
  else if(S.cfg){
    // мгновенный старт: показываем то, что было в прошлый раз, и обновляем в фоне
    S.list = store.get('list_'+S.me.point) || []; S.view='list'; render(); hideSplash();
    syncBoot(true);
  } else {
    if(!(await syncBoot(false))){ hideSplash(); return; }
    hideSplash();
  }
  if(S.me && API_URL && PUSH_CONFIGURED && 'Notification' in window && Notification.permission==='granted') enablePush(true); // обновить токен
  setInterval(()=>{ if(S.me && document.visibilityState==='visible' && S.view==='list') refresh(true); }, POLL_MS);
  // iPhone не всегда присылает visibilitychange при возврате в приложение — слушаем всё
  const wake = ()=>{ if(document.visibilityState==='visible' && S.me) refresh(true); };
  document.addEventListener('visibilitychange', wake);
  window.addEventListener('focus', wake);
  window.addEventListener('pageshow', wake);
}

/* Один запрос: точка + заявки + каталог (только если поменялся). */
async function syncBoot(silent, point){
  try{
    const r = await api('boot', {point: point || (S.me&&S.me.point), cfgVer: S.cfg && S.cfg.ver});
    if(r.config){ S.cfg = {...r.config, ver:r.cfgVer}; store.set('cfg', S.cfg); }
    S.me = {city:r.me.city, point:r.me.point, filial:r.me.filial}; store.set('point', S.me);
    applyList(r.list, silent);
    if(S.view==='list'||S.view==='pick'){ S.view='list'; render(); }
    return true;
  }catch(e){
    if(/не найдена|недоступны/i.test(e.message) && !point){ S.me=null; store.set('point',null); S.view='pick'; render(); toast(e.message); return false; }
    if(point) throw e;
    if(!S.cfg){ $app.innerHTML = `<div class="empty">Нет связи с сервером.<br>${esc(e.message)}<br><br><button class="btn ghost" onclick="location.reload()">Повторить</button></div>`; }
    else if(!silent) toast(e.message);
    return false;
  }
}
function applyList(list, silent){
  // заявки, которые ещё сохраняются, не теряем
  const pend = S.list.filter(t=>t.pending && !list.some(x=>x.id===t.id));
  S.list = pend.concat(list);
  store.set('list_'+S.me.point, list);
  if(S.openId){ const t=S.list.find(x=>x.id===S.openId); if(t){ S.tab = t.to===S.me.point ? 'in' : 'out'; if(S.view!=='list'&&S.view!=='new') S.view='list'; } S.openId=null; }
  const incomingNew = S.list.filter(t=>t.to===S.me.point && t.status==='Новая');
  const fresh = incomingNew.filter(t=>!S.seen.has(t.id));
  if(silent && fresh.length){ toast('Новая заявка от '+short(fresh[0].from)); if(navigator.vibrate) navigator.vibrate([120,60,120]); }
  incomingNew.forEach(t=>S.seen.add(t.id)); store.set('seen',[...S.seen].slice(-300));
}

let refreshing=null, refreshAgain=false;
async function refresh(silent){
  if(refreshing){ refreshAgain=true; return refreshing; }
  refreshing = doRefresh(silent);
  try{ await refreshing; } finally { refreshing=null; }
  if(refreshAgain){ refreshAgain=false; return refresh(true); }
}
async function doRefresh(silent){
  if(!S.me) return;
  try{ applyList(await api('list', {point:S.me.point}), silent); }
  catch(e){ if(!silent) toast(e.message); }
  if(S.view==='list') render();
}

/* ===== Отрисовка ===== */
function header(){
  const t = document.getElementById('title'), r = document.getElementById('hright');
  if(!S.me){ t.innerHTML='Перемещения'; r.innerHTML=''; return; }
  t.innerHTML = `${esc(short(S.me.point))}<span id="sync" aria-hidden="true"></span><small>Филиал ${esc(myFilial())}</small>`;
  r.innerHTML = S.view==='list' ? `<button class="hbtn" data-a="history">История</button><button class="hbtn" data-a="change">Сменить точку</button>` : '';
}

function render(){
  header();
  if(S.view==='pick') return renderPick();
  if(S.view==='new') return renderNew();
  if(S.view==='history') return renderHistory();
  renderList();
}

function renderPick(){
  const back = S.me ? '<button class="back" data-a="cancelnew">← Назад</button>' : '';
  if(!S.cfg){ $app.innerHTML = `<div class="pick login">${back}<img src="logo.png" alt="Яблонька"><div class="empty">Загружаем точки…</div></div>`; return; }
  if(!S.pickFilial){
    const fils = FILIALS.filter(f=>S.cfg.points.some(p=>filialOf(p)===f));
    $app.innerHTML = `<div class="pick login">${back}<img src="logo.png" alt="Яблонька">
      <h2>Ваш филиал</h2><p>Выбирается один раз — приложение запомнит.</p>
      ${fils.map(f=>`<button class="choice" data-a="filial" data-v="${esc(f)}">${esc(f)}</button>`).join('')}</div>`;
  } else {
    $app.innerHTML = `<div class="pick"><button class="back" data-a="pickback">← Филиал</button><h2>Ваша точка</h2><p>Филиал ${esc(S.pickFilial)}</p>
      <div class="field">${SEARCH_ICON}<input id="qme" class="search" placeholder="Найти свою точку…" autocomplete="off"></div>
      <div id="melist" style="margin-top:10px"></div></div>`;
    updMe();
  }
}
function updMe(){
  const el = document.getElementById('melist'); if(!el) return;
  const q = (document.getElementById('qme')||{}).value||'';
  const all = S.cfg.points.filter(p=>filialOf(p)===S.pickFilial);
  const pts = q.trim() ? matchList(all, q, p=>p.point, 50) : all;
  el.innerHTML = pts.map(p=>`<button class="choice" data-a="point" data-v="${esc(p.point)}">${q?hl(p.point,q):esc(p.point)}</button>`).join('') || '<div class="hint">Ничего не найдено.</div>';
}
async function choosePoint(point){
  const p = S.cfg.points.find(x=>x.point===point); if(!p) return;
  S.me = {city:p.city, point:p.point, filial:filialOf(p)}; store.set('point', S.me);
  S.pickFilial=null; S.list = store.get('list_'+p.point) || []; S.tab='in'; S.view='list'; render();
  await syncBoot(false);
  if(API_URL && pushStatus()==='ask' && Notification.permission==='granted') enablePush(true);
}

const PILL = {'Новая':['s-new','Ждёт принятия'],'Принята':['s-acc','Принята, в пути'],'Получена':['s-ok','Получена'],'Отклонена':['s-rej','Отклонена'],'Отменена':['s-can','Отменена']};

function card(t){
  const incoming = t.to===S.me.point;
  const [cls,label] = PILL[t.status]||['s-can',t.status];
  const need = incoming && (t.status==='Новая'||t.status==='Принята');
  const items = t.items.map(i=>{
    const d = (t.status==='Получена' && i.got!=null && +i.got!==+i.qty) ? `<span class="diff">получено ${esc(i.got)}</span>` : '';
    return `<li><span>${esc(i.product)}</span><span><b>${esc(i.qty)}</b> ${esc(i.unit)}${d}</span></li>`;
  }).join('');
  let acts='', hint='';
  if(t.pending){ hint='<span class="saving"></span>Сохраняем в таблицу…'; }
  else if(incoming && t.status==='Новая') acts = `<button class="btn danger" data-a="reject" data-id="${esc(t.id)}">Отклонить</button><button class="btn pri" data-a="accept" data-id="${esc(t.id)}">Принять</button>`;
  else if(incoming && t.status==='Принята'){ hint='Нажмите, когда товар будет у вас.'; acts = `<button class="btn blue" data-a="receive" data-id="${esc(t.id)}">Получили</button>`; }
  else if(!incoming && t.status==='Новая'){ hint=`Ждём, пока ${esc(t.to)} примет заявку.`; acts = `<button class="btn ghost" data-a="cancel" data-id="${esc(t.id)}">Отменить заявку</button>`; }
  else if(!incoming && t.status==='Принята') hint = `${esc(t.to)} приняла заявку — передайте товар.`;
  const pill = t.pending && /^tmp-/.test(t.id) ? `<span class="pill s-pend">Отправляется…</span>` : `<span class="pill ${cls}">${label}</span>`;
  return `<div class="card ${need&&!t.pending?'need':''} ${t.pending?'pending':''}">
    <div class="top"><div><div class="route">${incoming?`От: ${esc(short(t.from))}`:`Куда: ${esc(short(t.to))}`}</div>
      <div class="meta">${t.pending&&/^tmp-/.test(t.id)?'новая':esc(t.id)} · ${fmtT(t.created)}${t.received?` · получена ${fmtT(t.received)}`:''}</div></div>
      ${pill}</div>
    <ul class="items">${items}</ul>
    ${t.comment?`<div class="note">💬 ${esc(t.comment)}</div>`:''}
    ${t.reason?`<div class="note">Причина отказа: ${esc(t.reason)}</div>`:''}
    ${hint?`<div class="hint">${hint}</div>`:''}
    ${acts?`<div class="acts">${acts}</div>`:''}
  </div>`;
}

function renderList(){
  const mine = S.me.point;
  const inc = S.list.filter(t=>t.to===mine), out = S.list.filter(t=>t.from===mine);
  const needIn = inc.filter(t=>t.status==='Новая'||t.status==='Принята').length;
  const arr = S.tab==='in' ? inc : out;
  const active = arr.filter(t=>t.status==='Новая'||t.status==='Принята');
  const done = arr.filter(t=>!(t.status==='Новая'||t.status==='Принята'));
  const ps = pushStatus();
  const pushbar = ps==='ask' ? `<div class="pushbar"><span>Включите уведомления, чтобы не пропускать заявки.</span><button data-a="push">Включить</button></div>`
    : ps==='ios-install' ? `<div class="pushbar"><span>Для уведомлений на iPhone: «Поделиться» → «На экран Домой», затем откройте приложение с иконки.</span></div>`
    : ps==='denied' ? `<div class="pushbar"><span>Уведомления запрещены. Разрешите их в настройках телефона для этого приложения.</span></div>` : '';
  $app.innerHTML = `${pushbar}
    <div class="tabs">
      <button class="${S.tab==='in'?'on':''}" data-a="tab" data-v="in">Входящие${needIn?`<span class="badge">${needIn}</span>`:''}</button>
      <button class="${S.tab==='out'?'on':''}" data-a="tab" data-v="out">Исходящие</button>
    </div>
    ${!arr.length?`<div class="empty">${S.tab==='in'?'Входящих заявок пока нет.':'Вы ещё не отправляли заявок.'}</div>`:''}
    ${active.length?`<div class="sec">Активные</div>${active.map(card).join('')}`:''}
    ${done.length?`<div class="sec">Последние завершённые</div>${done.slice(0,5).map(card).join('')}<button class="more" data-a="history">Вся история →</button>`:''}
    <div class="bottombar"><button class="fab" data-a="new">+ Новое перемещение</button></div>`;
}

const DAY = d => { const x=new Date(d), n=new Date(); const y=new Date(n); y.setDate(n.getDate()-1);
  if(x.toDateString()===n.toDateString()) return 'Сегодня'; if(x.toDateString()===y.toDateString()) return 'Вчера';
  return x.toLocaleDateString('ru-RU',{day:'numeric',month:'long'}); };
async function openHistory(){
  S.view='history'; S.hist={items:null, filter:S.hist?S.hist.filter:'all'}; render(); window.scrollTo(0,0);
  try{ S.hist.items = await api('history', {point:S.me.point}); }
  catch(e){ S.hist.items=[]; toast(e.message); }
  if(S.view==='history') render();
}
function renderHistory(){
  const h=S.hist, mine=S.me.point;
  const f = h.filter;
  let items = h.items||[];
  if(f==='in') items = items.filter(t=>t.to===mine); else if(f==='out') items = items.filter(t=>t.from===mine);
  let body;
  if(h.items===null) body = '<div class="empty">Загружаем историю…</div>';
  else if(!items.length) body = '<div class="empty">Здесь пока пусто.</div>';
  else { let last=''; body = items.map(t=>{ const d=DAY(t.created); const head = d!==last ? `<div class="sec">${esc(d)}</div>` : ''; last=d; return head+card(t); }).join(''); }
  $app.innerHTML = `<button class="back" data-a="cancelnew">← Назад</button>
    <div class="histhead"><h2>История заявок</h2></div>
    <div class="filters">
      <button class="${f==='all'?'on':''}" data-a="hfilter" data-v="all">Все</button>
      <button class="${f==='in'?'on':''}" data-a="hfilter" data-v="in">Входящие</button>
      <button class="${f==='out'?'on':''}" data-a="hfilter" data-v="out">Исходящие</button>
    </div>
    ${body}
    ${h.items&&h.items.length>=200?'<div class="hint">Показаны последние 200 заявок за 90 дней.</div>':h.items&&h.items.length?'<div class="hint">Показаны заявки за последние 90 дней.</div>':''}`;
}

function renderNew(){
  const d = S.draft;
  $app.innerHTML = `
    <button class="back" data-a="cancelnew">← Назад</button>
    <div class="sec">1. Куда передаёте</div>
    <div id="toBox"></div>
    <div class="sec">2. Что передаёте</div>
    <div class="field">${SEARCH_ICON}<input id="q" class="search" placeholder="Найти товар…" autocomplete="off" enterkeyhint="search"></div>
    <div id="sugQ"></div>
    <div id="items"></div>
    <div class="sec">Комментарий (необязательно)</div>
    <textarea id="comment" placeholder="Например: заберёт курьер в 15:00">${esc(d.comment)}</textarea>
    <div class="bottombar"><button class="fab" data-a="send"></button></div>`;
  updTo(); updItems(); updSend();
}
function updTo(){
  const box = document.getElementById('toBox'); if(!box) return;
  const d = S.draft;
  if(d.to){
    box.innerHTML = `<div class="picked"><div class="t"><b>${esc(short(d.to))}</b><small>Филиал ${esc(myFilial())}</small></div>
      <button class="x" data-a="clearto" aria-label="Выбрать другую точку">✕</button></div>`;
  } else {
    box.innerHTML = `<div class="field">${SEARCH_ICON}<input id="qp" class="search" placeholder="Найти филиал по адресу…" autocomplete="off" value="${esc(d.qp||'')}"></div><div id="sugP"></div>`;
    updSugP();
  }
}
function updSugP(){
  const el = document.getElementById('sugP'); if(!el) return;
  const q = S.draft.qp||'';
  if(!q.trim()){ el.innerHTML=''; return; }
  const list = matchList(S.cfg.points.filter(p=>filialOf(p)===myFilial() && p.point!==S.me.point), q, p=>p.point, 8);
  el.innerHTML = `<div class="sug">${list.map(p=>`<button data-a="to" data-v="${esc(p.point)}"><span>${hl(p.point,q)}</span></button>`).join('') || '<div class="none">Такой точки нет в филиале '+esc(myFilial())+'</div>'}</div>`;
}
function updSugQ(){
  const el = document.getElementById('sugQ'); if(!el) return;
  const q = S.draft.q||'';
  const hint=document.querySelector('.empty-items'); if(hint) hint.hidden = !!q.trim();
  if(!q.trim()){ el.innerHTML=''; return; }
  const have = new Set(S.draft.items.map(i=>i.product));
  const list = matchList(S.cfg.products.filter(p=>!have.has(p.name)), q, p=>p.name, 8);
  el.innerHTML = `<div class="sug">${list.map(p=>`<button data-a="additem" data-v="${esc(p.name)}"><span>${hl(p.name,q)}</span><span class="u">${esc(p.unit)}</span></button>`).join('') || '<div class="none">Ничего не найдено</div>'}</div>`;
}
function updItems(){
  const el = document.getElementById('items'); if(!el) return;
  const its = S.draft.items;
  el.innerHTML = its.length ? its.map(i=>`<div class="item"><div class="n">${esc(i.product)}<small>${esc(i.unit)}</small></div>
      <div class="step"><button data-a="minus" data-v="${esc(i.product)}" aria-label="Меньше">−</button>
      <input inputmode="decimal" data-qty="${esc(i.product)}" value="${esc(i.qty)}" aria-label="Количество: ${esc(i.product)}">
      <button data-a="plus" data-v="${esc(i.product)}" aria-label="Больше">+</button></div>
      <button class="x" data-a="delitem" data-v="${esc(i.product)}" aria-label="Убрать ${esc(i.product)}">✕</button></div>`).join('')
    : '<div class="empty-items">Начните вводить название — появятся подсказки.</div>';
}
function updSend(){
  const f = document.querySelector('.fab[data-a=send]'); if(!f) return;
  const n = S.draft.items.filter(i=>num(i.qty)>0).length;
  f.disabled = !S.draft.to || !n;
  f.textContent = !S.draft.to ? 'Выберите точку' : !n ? 'Добавьте товары' : `Отправить заявку · ${n} поз.`;
}
const stepOf = unit => unit==='шт' ? 1 : 0.5;

/* ===== Окна ===== */
function sheet(html){ $layer.innerHTML = `<div class="sheet" data-a="close"><div class="box">${html}</div></div>`; }
function closeSheet(){ $layer.innerHTML=''; }

function openReceive(t){
  sheet(`<h3>Получение от ${esc(t.from)}</h3><p class="hint" style="margin-top:0">Проверьте количество. Если пришло не всё — исправьте цифру.</p>
    ${t.items.map(i=>`<div class="prod"><div class="n">${esc(i.product)} <span class="u">${esc(i.unit)} · ждали ${esc(i.qty)}</span></div>
      <div class="step"><input inputmode="decimal" data-got="${esc(i.product)}" value="${esc(i.qty)}"></div></div>`).join('')}
    <div class="acts"><button class="btn ghost" data-a="close">Назад</button><button class="btn pri" data-a="doreceive" data-id="${esc(t.id)}">Подтвердить</button></div>`);
}
function openReject(t){
  sheet(`<h3>Отклонить заявку от ${esc(t.from)}?</h3>
    <textarea id="reason" placeholder="Причина (необязательно)"></textarea>
    <div class="acts"><button class="btn ghost" data-a="close">Назад</button><button class="btn danger" data-a="doreject" data-id="${esc(t.id)}">Отклонить</button></div>`);
}

/* ===== Действия ===== */
async function act(fn, okMsg){
  document.body.classList.add('loading');
  try{ await fn(); if(okMsg) toast(okMsg); closeSheet(); await refresh(); }
  catch(e){ toast(e.message); }
  finally{ document.body.classList.remove('loading'); }
}
const byId = id => S.list.find(t=>t.id===id);
/* Мгновенное действие: меняем на экране сразу, сервер — в фоне; при ошибке откатываем. */
function optimistic(id, change, call, okMsg){
  const t = byId(id); if(!t || t.pending) return;
  const before = JSON.parse(JSON.stringify(t));
  change(t); t.pending = true; closeSheet(); if(S.view==='list') render(); if(okMsg) toast(okMsg);
  call().then(()=>{ t.pending=false; refresh(true); })
    .catch(e=>{ Object.keys(t).forEach(k=>delete t[k]); Object.assign(t, before); if(S.view==='list') render(); toast('Не сохранилось: '+e.message); refresh(true); });
}

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a, v = b.dataset.v, id = b.dataset.id;
  if(a==='close' && e.target!==b && b.classList.contains('sheet')) return;
  switch(a){
    case 'filial': S.pickFilial=v; render(); setTimeout(()=>{const i=document.getElementById('qme'); if(i) i.focus();},50); break;
    case 'pickback': S.pickFilial=null; render(); break;
    case 'point': choosePoint(v); break;
    case 'history': openHistory(); break;
    case 'hfilter': S.hist.filter=v; render(); break;
    case 'push': enablePush(false); break;
    case 'change': S.view='pick'; S.pickFilial=null; render(); break;
    case 'tab': S.tab=v; render(); break;
    case 'new': S.draft={to:null,qp:'',items:[],comment:'',q:''}; S.view='new'; render(); window.scrollTo(0,0); setTimeout(()=>{const i=document.getElementById('qp'); if(i) i.focus();},50); break;
    case 'cancelnew': S.view='list'; render(); break;
    case 'to': S.draft.to=v; S.draft.qp=''; updTo(); updSend(); if(!S.draft.items.length) document.getElementById('q').focus(); break;
    case 'clearto': S.draft.to=null; updTo(); updSend(); document.getElementById('qp').focus(); break;
    case 'additem': { const p=S.cfg.products.find(x=>x.name===v); if(!p) break;
      S.draft.items.push({product:p.name, unit:p.unit, qty:1}); S.draft.q='';
      const q=document.getElementById('q'); q.value=''; updSugQ(); updItems(); updSend();
      const inp=document.querySelector(`[data-qty="${CSS.escape(p.name)}"]`); if(inp){ inp.focus(); inp.select(); } break; }
    case 'delitem': S.draft.items = S.draft.items.filter(i=>i.product!==v); updItems(); updSend(); break;
    case 'plus': case 'minus': { const it=S.draft.items.find(i=>i.product===v); if(!it) break;
      let x = num(it.qty) + (a==='plus'?stepOf(it.unit):-stepOf(it.unit)); x = Math.max(0, Math.round(x*1000)/1000);
      it.qty = x; const inp=document.querySelector(`[data-qty="${CSS.escape(v)}"]`); if(inp) inp.value=x; updSend(); break; }
    case 'send': {
      const items = S.draft.items.filter(i=>num(i.qty)>0).map(i=>({product:i.product, qty:num(i.qty)}));
      if(!S.draft.to||!items.length) return;
      const d = S.draft, units = Object.fromEntries(d.items.map(i=>[i.product,i.unit]));
      const tmp = {id:'tmp-'+Date.now(), created:new Date().toISOString(), city:S.me.city, from:S.me.point, to:d.to, status:'Новая', accepted:'', received:'',
        comment:d.comment.trim(), reason:'', items:items.map(i=>({...i, unit:units[i.product]||'шт', got:null})), pending:true};
      S.list.unshift(tmp); S.view='list'; S.tab='out'; render(); window.scrollTo(0,0); toast('Заявка отправляется: '+short(d.to));
      api('create',{from:S.me.point,to:d.to,items,comment:tmp.comment})
        .then(r=>{ tmp.id=r.id; tmp.pending=false; if(S.view==='list') render(); refresh(true); })
        .catch(e=>{ S.list=S.list.filter(x=>x!==tmp); S.draft=d; S.view='new'; render(); updTo(); toast('Не отправилось: '+e.message); });
      break; }
    case 'accept': optimistic(id, t=>{ t.status='Принята'; t.accepted=new Date().toISOString(); }, ()=>api('accept',{id,point:S.me.point}), 'Заявка принята'); break;
    case 'reject': openReject(byId(id)); break;
    case 'doreject': { const reason=(document.getElementById('reason').value||'').trim();
      optimistic(id, t=>{ t.status='Отклонена'; t.reason=reason; }, ()=>api('reject',{id,point:S.me.point,reason}), 'Заявка отклонена'); break; }
    case 'cancel': optimistic(id, t=>{ t.status='Отменена'; }, ()=>api('cancel',{id,point:S.me.point}), 'Заявка отменена'); break;
    case 'receive': openReceive(byId(id)); break;
    case 'doreceive': {
      const items=[...document.querySelectorAll('[data-got]')].map(el=>({product:el.dataset.got, qty:Math.max(0, parseFloat(String(el.value).replace(',','.'))||0)}));
      optimistic(id, t=>{ t.status='Получена'; t.received=new Date().toISOString(); const g=Object.fromEntries(items.map(i=>[i.product,i.qty])); t.items.forEach(i=>i.got = g[i.product] ?? i.qty); },
        ()=>api('receive',{id,point:S.me.point,items}), 'Получение записано'); break; }
    case 'close': closeSheet(); break;
  }
});

document.addEventListener('input', e=>{
  const t = e.target;
  if(t.id==='q'){ S.draft.q=t.value; updSugQ(); }
  else if(t.id==='qp'){ S.draft.qp=t.value; updSugP(); }
  else if(t.id==='qme'){ updMe(); }
  else if(t.id==='comment'){ S.draft.comment=t.value; }
  else if(t.dataset.qty!==undefined){ const it=S.draft.items.find(i=>i.product===t.dataset.qty); if(it){ it.qty=t.value; updSend(); } }
});
// Enter в поиске выбирает первую подсказку
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const box = e.target.id==='q' ? 'sugQ' : e.target.id==='qp' ? 'sugP' : e.target.id==='qme' ? 'melist' : null;
  if(!box) return; e.preventDefault();
  const first = document.querySelector('#'+box+' [data-a]'); if(first) first.click();
});

/* ===== Свайп вниз — обновить ===== */
(function(){
  const ptr=document.getElementById('ptr'); const MAX=90, TRIG=65;
  let y0=null, dy=0, busy=false;
  const set=(d,op)=>{ ptr.style.transform=`translateY(${d}px) rotate(${d*3}deg)`; ptr.style.opacity=op; };
  document.addEventListener('touchstart', e=>{
    if(busy || S.view!=='list' || window.scrollY>0 || document.querySelector('.sheet')) { y0=null; return; }
    y0=e.touches[0].clientY; dy=0; ptr.style.transition='none';
    const hb=document.querySelector('header').getBoundingClientRect().bottom; ptr.style.top=(hb-40)+'px';
  }, {passive:true});
  document.addEventListener('touchmove', e=>{
    if(y0===null) return; dy=e.touches[0].clientY-y0;
    if(dy<=0 || window.scrollY>0){ set(-50,0); return; }
    const d=Math.min(MAX, dy*0.5); set(d, Math.min(1,d/TRIG));
  }, {passive:true});
  document.addEventListener('touchend', async ()=>{
    if(y0===null) return; y0=null; ptr.style.transition='transform .2s, opacity .2s';
    if(Math.min(MAX,dy*0.5) < TRIG){ set(-50,0); return; }
    busy=true; set(60,1); ptr.classList.add('spin');
    await refresh(false);
    ptr.classList.remove('spin'); set(-50,0); busy=false;
  });
})();

/* ===== Установка приложения (как в Leftover Control) ===== */
(function(){
  const card=document.getElementById('installCard'), btn=document.getElementById('installBtn'), steps=document.getElementById('installSteps');
  let deferred=null;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
  if(standalone) return;
  let dismissed=false; try{ dismissed = localStorage.getItem('install_hidden')==='1'; }catch(e){}
  const ua=navigator.userAgent; let manual;
  if(/SamsungBrowser/i.test(ua)) manual=['Нажмите ≡ (меню) внизу справа','Выберите «Добавить страницу на» → «Главный экран»','Нажмите «Добавить»'];
  else if(/YaBrowser/i.test(ua)) manual=['Нажмите ⋮ (меню)','Выберите «Добавить ярлык» / «На главный экран»','Или откройте эту страницу в Chrome — там установка в одно нажатие'];
  else if(/iPhone|iPad|iPod/i.test(ua)) manual=['Откройте страницу в Safari','Нажмите «Поделиться» (квадрат со стрелкой)','Выберите «На экран Домой» → «Добавить»'];
  else if(/Android/i.test(ua)) manual=['Нажмите ⋮ (меню) справа вверху','Выберите «Установить приложение» или «Добавить на главный экран»','Нажмите «Установить»'];
  else manual=['Нажмите значок установки в адресной строке (монитор со стрелкой)','Или ⋮ → «Трансляция, сохранение и отправка» → «Установить страницу как приложение»'];
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferred=e; btn.textContent='Установить'; steps.hidden=true; card.hidden=false; });
  btn.onclick=()=>{
    if(deferred){ deferred.prompt(); deferred.userChoice.then(c=>{ if(c&&c.outcome==='accepted') card.hidden=true; }); deferred=null; return; }
    if(steps.hidden){ steps.innerHTML=manual.map(t=>'<li>'+t+'</li>').join(''); steps.hidden=false; btn.textContent='Скрыть'; }
    else { steps.hidden=true; btn.textContent='Как установить'; try{ localStorage.setItem('install_hidden','1'); }catch(e){} card.hidden=true; }
  };
  window.addEventListener('appinstalled', ()=>{ card.hidden=true; });
  setTimeout(()=>{ if(!deferred && !dismissed){ btn.textContent='Как установить'; card.hidden=false; } }, 2500);
})();

boot();
</script>
